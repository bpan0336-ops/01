<!DOCTYPE html>
<html>
<head>
    <title>1102-JavaScript輸出與輸入</title>
    <style>
        /*css的註解*/
        #ans {
            width: 300px;
            height: 100px;
            background-color: gray;
        }
    </style>
    <script>
        /*js:javascipt */
        // js單行註解
        function say() {
            name = promp("What your name?");
            if(confirm("確定嗎"+ name + "嗎?")) {
                alert("你好, "+ name); 
            }else {
                alert("請重新打招呼!")
            }
            /*       問問題並回答 ,得到字串回復答案
            //console.log("hello");
            //alert("你好")
            
            ans = prompt("你叫什麼名字?");
            console.log(ans +"是" + typeof(ans) + "類型的");
            得到兩種結果: string/null(object)
            */
            /*確定是否
            ans = confirm("你確定嗎?")
            console.log(ans +"是" + typeof(ans) + "類型的");
            得到兩種結果:true/faise
            */
           //alert("你好")
           //console.log("hello");
           //doucument.getElementById("ans").innerHTML="HELLO"
           document.getElementById("ans").innerHTML="hello";
        }
        function setVol() {
            document.getElementById("vol_num").innerHTML = document.getElementById("vol_range").value;
        }
        function setBGcolor() {
            document.getElementById("ans").style.backgroundColor = document.getElementById("bgcolor").value;
        }
        function add() {
            n1 = parseInt(document.getElementById("n1").value);
            n2 = parseInt(document.getElementById("n2").value);

            document.getElementById("add_ans").innerHTML = (n1 + n2)
        }
        function ready() {
            setVol();
        }
    </script>
</head>
<body onload="">
    <button onclick="say();">Hello</button>
    <div id="ans"></div>
    <hr>
    <input type="text" value="text"><br>
    <input type="password" value="password"><br>
    <input type="number" value="123"><br>
    <input type="date" value="2026-11-02"><br>
    <input type="datetime-local" value="2026-11-02 02t08:57"><br>
    <input type="color" value="#FF0000" id="bgcolor" oninput="setBGcolor();"><br>
    <input type="range" id="vol_range" min="1" max="100" value="50" oninput="setVol();"><spam id="vol_num"></spam>
    <hr>
    <input type="number" id="n1"> + <input type="number" id="n2"><button onclick="add()">等於</button><spam id="add_ans"></spam>
    

</body>
</html>
